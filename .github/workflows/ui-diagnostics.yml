name: native UI diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-ui:
    runs-on: macos-15
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: production-window interactions with isolated services
        run: platforms/macos/Coddle/tests/ui/build.sh "$RUNNER_TEMP/coddle-native-ui" e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/coddle-native-ui/coddle-ui-evidence
          if-no-files-found: ignore
          retention-days: 7
